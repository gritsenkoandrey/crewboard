[package]
name = "task-track"
version = "0.1.0"
description = "Simple local task tracker"
authors = []
edition = "2024"

[lib]
# Суффикс `_lib` нужен, чтобы имя библиотеки не конфликтовало с бинарником на Windows.
name = "task_track_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
