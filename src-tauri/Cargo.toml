[package]
name = "crewboard"
default-run = "crewboard"
version = "0.1.0"
description = "Crewboard: local task board for people and AI agents"
authors = []
edition = "2024"

[lib]
# The `_lib` suffix prevents a library name collision with the Windows executable.
name = "crewboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
